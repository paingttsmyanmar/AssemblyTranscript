<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TranscriptTools</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


<h1>🎬 TranscriptTools</h1>

<p class="subtitle">
Video / Audio → AssemblyAI → Original Transcript
</p>



<div class="card">



<h2>🔑 AssemblyAI API Key</h2>


<input 
id="apiKey"
type="password"
placeholder="Paste your AssemblyAI API Key">



<div class="key-buttons">

<button onclick="saveKey()">
💾 Save
</button>


<button onclick="changeKey()">
✏️ Change
</button>


<button onclick="removeKey()">
🗑 Remove
</button>

</div>



<p>
Need AssemblyAI API Key?
</p>


<a href="https://www.assemblyai.com/app/account"
target="_blank">

👉 Get API Key

</a>





<!-- Telegram Promotion Box -->

<div class="telegram-box">

🔥 AI အသံစာလုံး အကန့်မရှိ ထုတ်ယူလိုပါသလား?

<br><br>

📩 Telegram မှာ ဆက်သွယ်ပါ

<br>

<span>@trollmovie123</span>

</div>






<h2>📁 Upload Video / Audio</h2>


<input 
id="file"
type="file"
accept="video/*,audio/*">





<button onclick="generateTranscript()">

✨ Generate Transcript

</button>






<!-- Processing Status -->

<div class="status-box">


<h2>⚙️ Processing Status</h2>


<p id="statusText">

Waiting...

</p>



<div class="progress-container">


<div 
id="progressBar"
class="progress-bar">

</div>


</div>



<p id="progressPercent">

0%

</p>



</div>









<h2>📝 Transcript Result</h2>


<textarea 
id="result"
placeholder="Transcript will appear here..."
></textarea>




<div>


<button onclick="copyText()">

📋 Copy

</button>


<button onclick="downloadText()">

⬇️ Download TXT

</button>


</div>



</div>



</div>



<script src="script.js"></script>


</body>

</html>
